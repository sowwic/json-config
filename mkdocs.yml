site_name: Json Config Documentation
site_description: Documentation for Json Config.
site_author: Dima Shevchenko
theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocs-autoapi:
      autoapi_dir: "src/json_config"
      autoapi_ignore:
        - "**/version.py"
        
        - "**/resources/*"
        - "**/main.py"
      autoapi_file_patterns:
        - "*.py"
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_signature: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true
  - autorefs

nav:
  - Home: index.md
  - User Guide:
      - user/index.md
      - Getting started: user/getting-started.md
      - Defining values: user/values.md
      - Layers: user/layers.md
      - Saving and reverting: user/saving.md
      - Recipes: user/recipes.md
  - Developer Guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - Resolution and saving: dev/resolution.md
      - Testing: dev/testing.md
      - Releasing: dev/releasing.md
